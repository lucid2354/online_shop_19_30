{% extends 'base.html' %}

{% block title %}Избранное{% endblock %}

{% block content %}
    <h1 class="h3">Избранное</h1>

    <div class="row row-cols-1 row-cols-md-3 g-3">
        {% for item in items %}
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <h2 class="h6">
                            <a href="{% url 'product_detail' item.product.slug %}">{{ item.product.name }}</a>
                        </h2>
                        <p>${{ item.product.price }}</p>
                        <form action="{% url 'toggle_wishlist' item.product.slug %}" method="post">
                            {% csrf_token %}
                            <button class="btn btn-outline-danger btn-sm" type="submit">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>Список пуст.</p>
        {% endfor %}
    </div>
{% endblock %}
