{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
    <div class="card mx-auto" style="max-width: 420px">
        <div class="card-body">
            <h1 class="h4">Вход</h1>

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {{ field.errors }}
                    </div>
                {% endfor %}

                <button class="btn btn-primary" type="submit">Войти</button>
            </form>

            <p class="mt-3 mb-0"><a href="{% url 'register' %}">Регистрация</a></p>
        </div>
    </div>
{% endblock %}
